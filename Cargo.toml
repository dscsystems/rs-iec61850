[package]
name = "rs-iec61850"
version = "0.3.1"
edition = "2021"
rust-version = "1.82"
authors = ["Ricardo Olsen", "DSC Systems"]
description = "A pure-Rust implementation of the IEC 61850 protocol family: MMS client/server, GOOSE, Sampled Values and SCL."
readme = "README.md"
repository = "https://github.com/dscsystems/rs-iec61850"
license-file = "LICENSE"
keywords = ["iec61850", "mms", "goose", "scada", "substation"]
categories = ["network-programming", "embedded"]
publish = false

[lib]
name = "iec61850"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
    # The bundled tools wait on ctrl-c; the library itself does not use it.
    "signal",
] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
tracing = "0.1"
quick-xml = "0.37"

# R-GOOSE and R-SV (IEC 61850-90-5) message security.
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
aes-gcm = "0.10"
getrandom = "0.2"
# Multicast group membership and socket options for the session protocol.
socket2 = { version = "0.5", features = ["all"] }

# TLS (IEC 62351-3) support.
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", optional = true }
webpki = { package = "rustls-webpki", version = "0.103", optional = true }

# GDOI group key management (IEC 62351-9): IKEv1 phase 1 and GROUPKEY-PULL.
aes = { version = "0.8", optional = true }
num-bigint = { version = "0.4", optional = true }
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"], optional = true }
p384 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"], optional = true }
rsa = { version = "0.9", optional = true }

# Raw layer-2 access (AF_PACKET) on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# Certificates and CRLs for the TLS profile and GDOI tests.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
time = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The JSON Lines of the mms-interop adapters and their fixtures.
serde_json = "1"

[features]
default = []
tls = ["dep:tokio-rustls", "dep:rustls", "dep:webpki"]
# GDOI key distribution (IEC 62351-9) for R-GOOSE and R-SV keys. It verifies
# certificates as the TLS profile does, so it needs that too.
gdoi = ["tls", "dep:aes", "dep:num-bigint", "dep:p256", "dep:p384", "dep:rsa"]
# Terminal UI client (iedx).
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies.ratatui]
version = "0.29"
optional = true

[dependencies.crossterm]
version = "0.28"
optional = true

[[bin]]
name = "ied-server"
path = "src/bin/ied-server.rs"

[[bin]]
name = "ied-client"
path = "src/bin/ied-client/main.rs"

[[bin]]
name = "goose-sniff"
path = "src/bin/goose-sniff.rs"
[[bin]]
name = "iedx"
path = "src/bin/iedx/main.rs"
required-features = ["tui"]

[profile.release]
lto = "thin"
codegen-units = 1
